<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>__PAGE_TITLE__</title>
<style>
:root{--bg:#f5f7f7;--paper:#fff;--ink:#132a2c;--muted:#607476;--line:#dce6e5;--accent:#0e756b;--light:#e9f4f0;--warn:#a45c10;--warnbg:#fff5e8;--good:#177549;--soft:#f4f8f8;--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}
.shell{max-width:1240px;margin:auto;display:grid;grid-template-columns:212px minmax(0,1fr);gap:34px;padding:0 24px}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:34px 20px 28px 0}.brand{display:flex;align-items:center;gap:10px;margin-bottom:42px;font-weight:790;letter-spacing:.1px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px}.sidenav a{display:block;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:13px;margin-bottom:4px}.sidenav a:hover{background:var(--light);color:var(--accent);text-decoration:none}.sidebar-foot{color:#9aabaa;font-size:11px;position:absolute;bottom:30px;left:0;padding-right:20px}.main{min-width:0;padding:35px 0 70px;max-width:970px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.6px;color:var(--accent);text-transform:uppercase}.hero{margin-bottom:24px}.hero h1{font-size:31px;line-height:1.24;letter-spacing:-.6px;margin:10px 0 10px;overflow-wrap:anywhere}.subtitle{font-size:13px;color:var(--muted);line-height:1.8}.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:25px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;min-width:0}.stat .num{font-size:23px;font-weight:760;font-variant-numeric:tabular-nums;line-height:1.2}.stat .unit{color:var(--muted);font-size:11px;margin-top:7px}.section{scroll-margin-top:20px;margin:29px 0 0}.section-head{display:flex;align-items:baseline;gap:11px;margin:0 0 14px}.section-no{font:700 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}.section h2{font-size:19px;margin:0;letter-spacing:-.3px}.section-intro{font-size:13px;color:var(--muted);margin:-4px 0 14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:12px 0}.panel h3{font-size:15px;margin:0 0 9px}.summary-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:13px 15px;min-width:0}.label{font-size:11px;letter-spacing:.2px;font-weight:750;color:var(--accent);margin-bottom:6px}.summary p{margin:0;overflow-wrap:anywhere}.mission{font-size:15px;font-weight:650;margin:0 0 17px}.module-stack{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:720px;margin:20px auto}.module-wrap{display:flex;flex-direction:column;align-items:center}.module{width:100%;border:1px solid var(--line);border-left:4px solid #c2d4d1;border-radius:12px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:11px;padding:11px 13px;background:white}.module.direct{border-left-color:var(--accent);background:#f0faf7}.module.indirect{border-left-color:#dba65f;background:#fffaf4}.mod-count{font-size:11px;font-family:monospace;color:#8da1a0}.mod-name{font-weight:750;display:block}.mod-role{font-size:12px;color:var(--muted);display:block;margin-top:2px}.tag{font-size:11px;border-radius:20px;border:1px solid var(--line);padding:3px 9px;white-space:nowrap;color:var(--muted)}.tag.direct{color:var(--accent);border-color:#b2d9cd;background:#e4f4ee}.tag.indirect{color:var(--warn);background:var(--warnbg);border-color:#f1d3a8}.connector{font-size:18px;color:#a1b5b0;line-height:17px}.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.flow-box{background:#f7fafa;border:1px solid var(--line);border-radius:13px;padding:15px}.flow-box.new{background:#eef8f4;border-color:#cce5db}.flow-box h3{margin:0 0 12px;font-size:13px}.flow-items{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.flow-item{border-radius:8px;padding:5px 9px;background:#fff;border:1px solid var(--line);font-size:12px}.flow-box.new .flow-item{border-color:#c0ded4}.flow-arrow{color:#899e9c}.insight{border-left:3px solid #8bbcb0;padding-left:12px;margin:15px 0 0;color:#435a5d}.feature-card{padding:19px 20px}.feature-card h3{font-size:16px;margin:0 0 12px}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feature-grid>div{background:var(--soft);border-radius:11px;padding:12px 14px;min-width:0}.evidence{margin-top:12px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.evidence code{font-size:11px;background:#eff4f4;border-radius:4px;padding:2px 5px}.acceptance{font-size:12px;margin:12px 0 0}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff-old,.diff-new{border-radius:11px;padding:13px 15px;background:#f8faf9;border:1px solid var(--line)}.diff-new{background:#edf8f4;border-color:#d2e8df}.diff-grid p{margin:2px 0}.why{border-top:1px solid var(--line);padding-top:10px;margin-top:13px;font-size:12px;color:#496063}.tree-tools{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:13px}.tree-tools input{width:min(100%,350px);border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none}.tree-tools input:focus{border-color:var(--accent)}.filetree{font:12px/1.85 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#42585c}.filetree details{margin:0;padding-left:12px;border-left:1px dashed #d7e3df}.filetree details>summary{cursor:pointer;list-style:none}.filetree details>summary::-webkit-details-marker{display:none}.filetree .folder:before{content:'▾';color:#78948f;margin-right:6px}.filetree details:not([open])>.folder:before{content:'▸'}.leaf{display:flex;align-items:baseline;gap:9px;padding:2px 3px 2px 17px;white-space:normal;overflow-wrap:anywhere}.filename{font-weight:600;color:#2c5252}.muted{color:var(--muted)}.delta{margin-left:auto;font-size:11px;white-space:nowrap}.add{color:#187b52}.del{color:#b75f58}.file-note{font:11px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--muted)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checkline{border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.checkline:last-child{border-bottom:0}.status{font-weight:700;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}.status.passed{color:var(--good);background:#e7f5ed}.status.failed{color:#b53730;background:#ffefeb}.status.not_run,.status.partial{color:var(--warn);background:var(--warnbg)}.risk{margin-bottom:12px;font-size:12px}.risk strong{color:var(--warn)}.phase-row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:16px 0}.phase-row:last-child{border:0}.phase-n{font:700 15px monospace;color:var(--accent)}.phase-title{font-weight:750;font-size:15px}.phase-desc{font-size:12px;color:var(--muted);margin-top:5px}.phase-open{font-size:12px;white-space:nowrap}.note{color:var(--muted);font-size:12px}.footer{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;color:#8ca19f;font-size:11px}.empty{color:var(--muted);font-size:12px}.print-link{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--muted)}
@media(max-width:840px){.shell{display:block;padding:0 18px}.sidebar{position:static;height:auto;border:0;padding:19px 0 0}.brand{margin-bottom:8px}.sidenav{display:flex;flex-wrap:wrap;gap:4px}.sidenav a{margin:0;padding:6px 9px}.sidebar-foot{display:none}.main{padding:22px 0 46px}.hero h1{font-size:24px}.statbar{grid-template-columns:1fr 1fr}.summary-pair,.flow-grid,.feature-grid,.diff-grid,.checks{grid-template-columns:1fr}.module{grid-template-columns:22px minmax(0,1fr) auto}.panel{padding:15px}}
@media print{body{background:white}.shell{display:block}.sidebar,.print-link,.tree-tools{display:none}.main{padding:0;max-width:none}.section{break-inside:avoid}.panel{break-inside:avoid;box-shadow:none}.filetree details{display:block}.filetree details>div{display:block!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">AC</div>Architecture Change</div><nav class="sidenav" id="nav"></nav><div class="sidebar-foot">Git facts × Business insight × Architecture<br>离线报告 · 证据驱动</div></aside>
<main class="main" id="app"></main>
</div>
<script id="payload" type="application/json"><!--__PAYLOAD__--></script>
<script>
(() => {
  'use strict';
  const P = JSON.parse(document.getElementById('payload').textContent);
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const text = t => esc(t || '未说明');
  const sec = (number, title, id, intro='') => `<section class="section" id="${id}"><div class="section-head"><span class="section-no">${number}</span><h2>${esc(title)}</h2></div>${intro ? `<p class="section-intro">${esc(intro)}</p>`:''}`;
  const evidence = list => (list && list.length) ? `<div class="evidence">证据：${list.map(x => `<code>${esc(typeof x==='string'?x:x.path)}</code>`).join(' ')}</div>` : '';
  const cards = (files, phases) => {
    let added=(files?.added||0), deleted=(files?.deleted||0);
    return `<div class="statbar"><div class="stat"><div class="num">${esc(files?.effective_files ?? 0)}</div><div class="unit">有效变更文件</div></div><div class="stat"><div class="num">${esc(files?.line_changes??0)}</div><div class="unit">有效代码增删行</div></div><div class="stat"><div class="num add">+${added}</div><div class="unit">新增代码行</div></div><div class="stat"><div class="num del">−${deleted}</div><div class="unit">删除代码行</div></div></div>`;
  };
  const architecture = doc => {
    const s=doc.system||{}, modules=s.module_flow||[];
    return `<div class="panel"><div class="mission">${text(s.mission)}</div><div class="summary-pair"><div class="summary"><div class="label">业务视角 · 影响了什么</div><p>${text(s.business_impact)}</p></div><div class="summary"><div class="label">技术视角 · 改动落点</div><p>${text(s.technical_impact)}</p></div></div><div class="module-stack">${modules.map((m,i)=>`<div class="module-wrap"><div class="module ${esc(m.impact)}"><div class="mod-count">${String(i+1).padStart(2,'0')}</div><div><span class="mod-name">${text(m.name)}</span><span class="mod-role">${text(m.responsibility)}</span>${evidence(m.evidence)}</div><span class="tag ${esc(m.impact)}">${({direct:'直接改动', indirect:'间接受影响', untouched:'未触及'})[m.impact]||'待确认'}</span></div>${i<modules.length-1?'<div class="connector">↓</div>':''}</div>`).join('')}</div></div>`;
  };
  const flow = doc => {
    let f=doc.flow||{};
    const renderList=list=>`<div class="flow-items">${(list||[]).map((step,i)=>`${i>0?'<span class="flow-arrow">→</span>':''}<span class="flow-item">${esc(step)}</span>`).join('')}</div>`;
    return `<div class="panel"><h3>${text(f.label)}</h3><div class="flow-grid"><div class="flow-box"><h3>BEFORE · 修改前</h3>${renderList(f.before)}</div><div class="flow-box new"><h3>AFTER · 修改后</h3>${renderList(f.after)}</div></div><div class="insight">${text(f.explanation)}</div>${evidence(f.evidence)}</div>`;
  };
  const features = doc => (doc.capabilities||[]).map((c,i)=>`<article class="panel feature-card"><h3>${i+1}. ${text(c.name)}</h3><div class="feature-grid"><div><div class="label">业务专家 · 完成的能力</div>${text(c.business)}</div><div><div class="label">技术专家 · 实现机制</div>${text(c.technical)}</div></div><div class="acceptance"><b>验收方式：</b>${text(c.acceptance)}</div>${evidence(c.evidence)}</article>`).join('');
  const diffs = doc => (doc.differences||[]).map((d,i)=>`<article class="panel"><h3>${i+1}. ${text(d.title)}</h3><div class="diff-grid"><div class="diff-old"><div class="label">BEFORE</div><p>${text(d.before)}</p></div><div class="diff-new"><div class="label">AFTER</div><p>${text(d.after)}</p></div></div><div class="why"><strong>价值与权衡：</strong>${text(d.reason)}</div>${evidence(d.evidence)}</article>`).join('');
  const checks = doc => {
    const vals=doc.validation||[], risks=doc.risks||[];
    return `<div class="checks"><div class="panel"><h3>验证记录</h3>${vals.length?vals.map(v=>`<div class="checkline"><span class="status ${esc(v.status)}">${({passed:'通过', failed:'失败', partial:'部分验证', not_run:'未运行'})[v.status]||'未知'}</span> <strong>${text(v.item)}</strong><div class="note">${text(v.detail)}</div></div>`).join(''):'<p class="empty">未记录验证</p>'}</div><div class="panel"><h3>未解决问题 / 风险</h3>${risks.length?risks.map(r=>`<div class="risk"><strong>${text(r.level||'待确认')}</strong> · ${text(r.detail)}${evidence(r.evidence)}</div>`).join(''):'<p class="empty">未记录已知风险（不代表没有风险）</p>'}</div></div>`;
  };
  const treeFrom = (files, notes) => {
    const make = () => ({children:{},files:[]}); const root=make();
    for(const f of files||[]){const parts=f.path.split('/');let node=root;for(let i=0;i<parts.length-1;i++){node=node.children[parts[i]] ??= make()}node.files.push({...f,short:parts.at(-1),note:notes?.[f.path]||''});}
    const walk=(node,level)=>{
      let html='';
      for(const name of Object.keys(node.children).sort()){
        html+=`<details ${level<2?'open':''}><summary class="folder">${esc(name)}/</summary><div>${walk(node.children[name],level+1)}</div></details>`;
      }
      for(const f of node.files.sort((a,b)=>a.short.localeCompare(b.short))){
        html+=`<div class="leaf"><span class="filename">${esc(f.short)}</span><span class="muted">${esc(f.status)}</span>${f.note?`<span class="file-note">${esc(f.note)}</span>`:''}<span class="delta"><span class="add">+${f.added}</span> <span class="del">−${f.deleted}</span></span></div>`;
      }
      return html;
    };
    return walk(root,0)||'<p class="empty">没有匹配的文件</p>';
  };
  const tree=doc=>`<div class="panel"><div class="tree-tools"><input id="tree-search" type="search" placeholder="搜索文件路径 / 文件名"><span class="note">tree -L 风格 · 路径按目录分组</span></div><div class="filetree" id="filetree">${treeFrom(doc.files,doc.file_notes)}</div><div class="note">有效文件 ${doc.stats.effective_files} · 完整纳入树中的文件 ${doc.stats.all_files}。+ / − 为去除纯空白变动后的增删行数。</div></div>`;
  const header = (title, meta) => `<header class="hero"><div class="eyebrow">Architecture Change Review / 代码变更透视</div><h1>${text(title)}</h1><div class="subtitle">${esc(meta)}</div></header>`;
  const renderPhase = doc => {
    const time=doc._internal?.captured_at||'';
    return `${header(doc.phase_title,`任务：${doc.task} ｜ 阶段 ${doc._internal?.phase} ｜ ${time}`)}${cards(doc.stats)}${sec('01','系统架构与影响范围','architecture','先看系统定位和变更波及范围，再进入具体代码。')}${architecture(doc)}${sec('02','主要业务链路 Before / After','flow')}${flow(doc)}${sec('03','完成的业务功能','features','业务价值与技术实现一一对应。')}${features(doc)}${sec('04','关键设计差异','differences')}${diffs(doc)}${sec('05','目录级改动定位','files')}${tree(doc)}${sec('06','验证与风险','validation')}${checks(doc)}<div class="footer">报告依据 Git 本地源码快照生成；业务结论由 Agent 阅读代码补充，未经验证的效果不应视为事实。<button class="print-link" onclick="window.print()">打印 / 存 PDF</button></div>`;
  };
  const renderIndex = P => {
    const l=P.latest, phases=P.phases||[];
    const cumulative = phases.reduce((a,p)=>a+(p.stats?.line_changes||0),0);
    const unique=Array.from(new Set(phases.flatMap(p=>p.capabilities||[]))).length;
    const summary=`<div class="statbar"><div class="stat"><div class="num">${phases.length}</div><div class="unit">阶段检查点</div></div><div class="stat"><div class="num">${unique}</div><div class="unit">阶段业务能力条目</div></div><div class="stat"><div class="num">${cumulative}</div><div class="unit">阶段增删行合计（非净增）</div></div><div class="stat"><div class="num">${l.stats?.effective_files||0}</div><div class="unit">最新阶段有效文件</div></div></div>`;
    const items=phases.map(p=>`<article class="phase-row"><div class="phase-n">${String(p.phase).padStart(2,'0')}</div><div><div class="phase-title">${text(p.title)}</div><div class="phase-desc">${(p.capabilities||[]).map(esc).join(' · ')}</div><div class="phase-desc">${esc(p.stats?.effective_files)} 文件 · ${esc(p.stats?.line_changes)} 行增删 · ${esc(p.captured_at)}</div></div><a class="phase-open" href="${encodeURI(p.html)}">查看细节 →</a></article>`).join('');
    return `${header(l.task,'持续开发架构复盘 · 由阶段 Checkpoint 累积，最新架构见下方')}${summary}${sec('01','最新系统架构 / 改动定位','architecture')}${architecture(l)}${sec('02','最新端到端主链路','flow')}${flow(l)}${sec('03','阶段性功能与里程碑','phases')}${`<div class="panel">${items}</div>`}${sec('04','最新阶段关键设计差异','differences')}${diffs(l)}${sec('05','最新阶段验证与风险','validation')}${checks(l)}<div class="footer">每个阶段 HTML 对应独立源码快照。此总览由已验证的阶段报告自动整合，不等同于完整端到端回归测试。</div>`;
  };
  const isIndex=P.mode==='index';
  $('app').innerHTML=isIndex?renderIndex(P):renderPhase(P.report);
  const links=isIndex?[
      ['architecture','01 · 整体架构'],['flow','02 · 核心链路'],['phases','03 · 阶段汇总'],['differences','04 · 主要差异'],['validation','05 · 验证风险']
    ]:[['architecture','01 · 架构影响'],['flow','02 · 业务链路'],['features','03 · 完成功能'],['differences','04 · Before / After'],['files','05 · 文件树'],['validation','06 · 验证风险']];
  $('nav').innerHTML=links.map(([id,t])=>`<a href="#${id}">${t}</a>`).join('');
  const s=$('tree-search');
  if(s){s.addEventListener('input',()=>{const q=s.value.trim().toLowerCase();const doc=P.report;const matched=(doc.files||[]).filter(f=>f.path.toLowerCase().includes(q));$('filetree').innerHTML=treeFrom(matched,doc.file_notes);});}
})();
</script>
</body></html>
